# Скопировать в /etc/nginx/sites-available/app.onetable.pro
# и создать симлинк в /etc/nginx/sites-enabled/

limit_req_zone $binary_remote_addr zone=onetable_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=onetable_api:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name app.onetable.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.onetable.pro;

    # Сертификаты выпускаются командой: certbot --nginx -d app.onetable.pro
    ssl_certificate     /etc/letsencrypt/live/app.onetable.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.onetable.pro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Заголовки безопасности
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 256k;

    # Жёсткий rate-limit на вход и принятие приглашений
    location ^~ /api/auth/ {
        limit_req zone=onetable_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        limit_req zone=onetable_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
