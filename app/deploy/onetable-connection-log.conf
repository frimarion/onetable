map "$server_name:$uri" $onetable_connection_step {
    default "";
    ~^(app|gw)\.onetable\.pro:/$ page;
    ~^(app|gw)\.onetable\.pro:/clubs/[^/]+/?$ page;
    ~^(app|gw)\.onetable\.pro:/assets/[^/]+\.js$ script;
    ~^(app|gw)\.onetable\.pro:/api/demo$ mode;
    ~^(app|gw)\.onetable\.pro:/api/auth/providers$ providers;
    ~^(app|gw)\.onetable\.pro:/api/auth/me$ session;
    ~^(app|gw)\.onetable\.pro:/api/auth/login$ login;
    ~^(app|gw)\.onetable\.pro:/api/doyle/read-ticket$ ticket;
    ~^(app|gw)\.onetable\.pro:/api/doyle/snapshot$ snapshot;
}

map $server_name $onetable_connection_route {
    default "";
    app.onetable.pro direct;
    gw.onetable.pro gateway;
}

map $http_cf_ray $onetable_connection_cf_ray {
    default "-";
    "~^[0-9a-fA-F]{16}-[A-Z]{3}$" $http_cf_ray;
}

log_format onetable_connection escape=json
    '{"time":"$time_iso8601","route":"$onetable_connection_route","step":"$onetable_connection_step",'
    '"method":"$request_method","protocol":"$server_protocol","scheme":"$scheme",'
    '"client":"$remote_addr","peer":"$realip_remote_addr","cf_ray":"$onetable_connection_cf_ray",'
    '"status":$status,"seconds":"$request_time","connect":"$upstream_connect_time",'
    '"first_byte":"$upstream_header_time","upstream_seconds":"$upstream_response_time",'
    '"body_sent":$body_bytes_sent,"upstream_body":"$upstream_response_length",'
    '"content_length":"$sent_http_content_length","encoding":"$sent_http_content_encoding",'
    '"complete":"$request_completion"}';

access_log /var/log/nginx/onetable-connection.log onetable_connection if=$onetable_connection_step;
