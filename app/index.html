<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f0d">
    <script>
      try {
        var t = localStorage.getItem('onetable-theme');
        var isLight = t === 'light' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (isLight) {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#f2f3f5';
        }
        var raw = localStorage.getItem('onetable-prefs');
        if (raw) {
          var p = JSON.parse(raw);
          if (p && p.density === 'compact') document.documentElement.dataset.density = 'compact';
          if (p && p.reducedMotion) document.documentElement.dataset.motion = 'reduced';
        }
      } catch {}
    </script>
    <title>OneTable — Турниры и CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
